name: probe-sources

# Diagnostic only. Tests, from a real GitHub-hosted runner, which transcript/audio sources work:
# YouTube metadata per player client, a ranged YouTube audio download, the All-In podcast RSS enclosure,
# and faster-whisper CPU speed. Spends no model quota. See README "YouTube blocks GitHub-hosted runners".
on:
  workflow_dispatch:
    inputs:
      whisper:
        description: "Also time faster-whisper base.en on 5 minutes of podcast audio"
        type: boolean
        default: true
      whisper_model:
        description: "faster-whisper model for the end-to-end ingest (small.en, medium.en, ...)"
        type: string
        default: "small.en"
      whisper_hotwords:
        description: "Glossary for the end-to-end ingest (ALLIN_WHISPER_HOTWORDS): empty = built-in default, 'off' = none"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install
      - run: uv sync --frozen --extra whisper
      - uses: denoland/setup-deno@v2.0.5
      - name: Probe sources
        run: |
          set -o pipefail
          if [ "${{ inputs.whisper }}" = "true" ]; then
            uv run python scripts/probe_sources.py --whisper | tee probe.json
          else
            uv run python scripts/probe_sources.py | tee probe.json
          fi
          { echo "## Source probe"; echo '```json'; cat probe.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: End-to-end ingest of the newest episode via the fallback chain (scratch data dir)
        # Proves the whole runner path: playlist listing -> podcast metadata -> podcast mp3 -> whisper -> normalize.
        env:
          ALLIN_DATA_DIR: /tmp/allin-probe-data
          ALLIN_WHISPER_MODEL: ${{ inputs.whisper_model }}
          ALLIN_WHISPER_HOTWORDS: ${{ inputs.whisper_hotwords }}
        run: |
          set -o pipefail
          uv run allin ingest --limit 1 | tee ingest.json
          uv run python - <<'PY' | tee e2e.txt
          import json
          idx = json.load(open("/tmp/allin-probe-data/index.json"))
          for vid, e in idx["episodes"].items():
              print(f"{vid}: status={e['status']} source={e.get('transcript_source')} published={e.get('published_at')} "
                    f"duration={e.get('duration_seconds')} chapters={len(e.get('chapters') or [])} error={str(e.get('last_error'))[:160]}")
              try:
                  t = json.load(open(f"/tmp/allin-probe-data/transcripts/{vid}.normalized.json"))
                  print(f"  words={t['word_count']} paragraphs={len(t['paragraphs'])} source_detail={t.get('source_detail')}")
                  print("  first:", t["paragraphs"][0]["start"], t["paragraphs"][0]["text"][:160])
              except FileNotFoundError:
                  print("  (no normalized transcript)")
          PY
          { echo "## End-to-end ingest"; echo '```'; cat e2e.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the probe transcript (to compare models offline)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: probe-transcript-${{ inputs.whisper_model }}-${{ inputs.whisper_hotwords == 'off' && 'plain' || 'glossary' }}
          path: /tmp/allin-probe-data/transcripts/*.normalized.json
          if-no-files-found: warn
          retention-days: 7
