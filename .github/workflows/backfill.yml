# One-time backfill of the N most recent full episodes.
#
# mode=estimate  fetches transcripts and prints a token / API-equivalent estimate. No model call, no token.
# mode=run       SPENDS Max-subscription quota (Claude Opus analysis of every pending episode).
#                Only run it after an "estimate" run whose summary the owner has reviewed.
name: backfill

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of most recent full episodes to backfill"
        type: string
        default: "10"
      mode:
        description: "estimate = no model calls; run = spend Max quota (review an estimate first)"
        type: choice
        options:
          - estimate
          - run
        default: estimate

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: all-in-signal-pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backfill:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.commit.outputs.data_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.319
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
      - name: Validate count
        env:
          COUNT: ${{ inputs.count }}
        run: |
          case "$COUNT" in
            ''|*[!0-9]*) echo "count must be a positive integer" >&2; exit 1 ;;
          esac
          if [ "$COUNT" -lt 1 ]; then echo "count must be a positive integer" >&2; exit 1; fi
      - name: Estimate (no model calls)
        if: inputs.mode == 'estimate'
        env:
          COUNT: ${{ inputs.count }}
          ALLIN_YT_PROXY: ${{ secrets.ALLIN_YT_PROXY }}
        run: |
          set -o pipefail  # default `bash -e` would let tee mask a failed ingest/estimate
          uv run allin backfill --count "$COUNT" --estimate-only | tee estimate.txt
          {
            echo "## Backfill estimate (count=$COUNT)"
            echo '```'
            cat estimate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Backfill (spends Max quota)
        if: inputs.mode == 'run'
        env:
          COUNT: ${{ inputs.count }}
          ALLIN_YT_PROXY: ${{ secrets.ALLIN_YT_PROXY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run allin backfill --count "$COUNT" --confirm
      - name: Build site
        if: inputs.mode == 'run'
        run: uv run allin build-site --out _site
      - name: Commit data
        id: commit
        if: inputs.mode == 'run'
        env:
          COUNT: ${{ inputs.count }}
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
            exit 0
          fi
          git config user.name "all-in-signal[bot]"
          git config user.email "noreply@github.com"
          git add data/
          git commit -m "data: backfill $(date -u +%Y-%m-%d) (count=${COUNT})"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "data_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "could not push data after 3 attempts" >&2
          exit 1
      - uses: actions/upload-pages-artifact@v5
        if: inputs.mode == 'run'
        with:
          path: _site

  deploy:
    needs: backfill
    if: inputs.mode == 'run'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
