# Detects YouTube IP blocking and missing runner tooling before the backfill.
name: verify-runner

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.319
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
      - name: Verify runner
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail  # default `bash -e` would let tee mask a verify-runner failure
          rc=0
          uv run allin verify-runner | tee verify.json || rc=$?
          {
            echo "## verify-runner (exit $rc)"
            echo '```json'
            cat verify.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
