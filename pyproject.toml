[project]
name = "all-in-signal"
version = "0.1.0"
description = "Research pipeline: All-In Podcast episodes -> Claude Opus structured ledger (takes, predictions, stock implications, Polymarket calls) + per-host scorecard + static dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9,<3",
  "youtube-transcript-api>=1.0,<2",
  "yt-dlp>=2026.1.1",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.9,<4",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
whisper = [
  "faster-whisper>=1.1,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
allin = "allin.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
